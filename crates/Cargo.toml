[workspace]
resolver = "2"
members = [
    "runtime",
    "protocol",
    "pty",
    "tools",
    "llm",
    "session",
    "agent",
    "mcp",
    "plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/opencode-ai/opencode"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
opencode-protocol = { path = "protocol" }
opencode-pty = { path = "pty" }
opencode-tools = { path = "tools" }
opencode-llm = { path = "llm" }
opencode-session = { path = "session" }
opencode-agent = { path = "agent" }
opencode-mcp = { path = "mcp" }
opencode-plugin = { path = "plugin" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
